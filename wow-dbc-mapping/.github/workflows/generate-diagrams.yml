name: Generate Mermaid Diagrams

on:
  push:
    paths:
      - 'diagrams/*.mmd'
      - 'diagrams/**/*.mmd'
  pull_request:
    paths:
      - 'diagrams/*.mmd'
      - 'diagrams/**/*.mmd'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme for diagrams (dark, default, neutral, forest)'
        required: false
        default: 'dark'
        type: choice
        options:
          - dark
          - default
          - neutral
          - forest
      format:
        description: 'Output format (png, svg, pdf)'
        required: false
        default: 'png'
        type: choice
        options:
          - png
          - svg
          - pdf
      width:
        description: 'Width of output images (pixels)'
        required: false
        default: '1920'
        type: string
      height:
        description: 'Height of output images (pixels)'
        required: false
        default: '1080'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate Diagrams
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        theme: [dark, default]
        format: [png, svg]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Cache Mermaid CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli@latest
          mmdc --version
      
      - name: Create output directories
        run: |
          mkdir -p images/dark
          mkdir -p images/light
          mkdir -p images/svg
          mkdir -p images/pdf
          echo "Directories created"
      
      - name: Generate diagrams (Matrix)
        run: |
          THEME="${{ matrix.theme }}"
          FORMAT="${{ matrix.format }}"
          
          if [ "$FORMAT" = "svg" ]; then
            OUTPUT_DIR="images/svg"
          else
            if [ "$THEME" = "dark" ]; then
              OUTPUT_DIR="images/dark"
            else
              OUTPUT_DIR="images/light"
            fi
          fi
          
          for file in diagrams/*.mmd diagrams/**/*.mmd; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .mmd)
              dirname=$(dirname "$file" | sed 's/diagrams\///')
              
              if [ "$dirname" = "diagrams" ] || [ "$dirname" = "." ]; then
                output_file="${OUTPUT_DIR}/${filename}"
              else
                mkdir -p "${OUTPUT_DIR}/${dirname}"
                output_file="${OUTPUT_DIR}/${dirname}/${filename}"
              fi
              
              echo "Generating: $file -> ${output_file}.${FORMAT}"
              
              mmdc \
                -i "$file" \
                -o "${output_file}.${FORMAT}" \
                -t "$THEME" \
                -b transparent \
                -w 1920 \
                -H 1080 \
                -s 2 \
                --pdfFit \
                || echo "Warning: Failed to generate $file"
            fi
          done
      
      - name: Generate diagrams (Manual Input)
        if: github.event_name == 'workflow_dispatch'
        run: |
          THEME="${{ github.event.inputs.theme }}"
          FORMAT="${{ github.event.inputs.format }}"
          WIDTH="${{ github.event.inputs.width }}"
          HEIGHT="${{ github.event.inputs.height }}"
          
          OUTPUT_DIR="images/custom"
          mkdir -p "$OUTPUT_DIR"
          
          for file in diagrams/*.mmd; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .mmd)
              echo "Generating: $file -> ${OUTPUT_DIR}/${filename}.${FORMAT}"
              
              mmdc \
                -i "$file" \
                -o "${OUTPUT_DIR}/${filename}.${FORMAT}" \
                -t "$THEME" \
                -b transparent \
                -w "$WIDTH" \
                -H "$HEIGHT" \
                -s 2 \
                --pdfFit
            fi
          done
      
      - name: Generate HTML gallery
        run: |
          cat > images/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Galerie des Diagrammes DBC</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      margin: 0;
                      padding: 20px;
                      background: #1a1a2e;
                      color: #e0e0e0;
                  }
                  h1 {
                      color: #4ecdc4;
                      border-bottom: 2px solid #4ecdc4;
                      padding-bottom: 10px;
                  }
                  .gallery {
                      display: grid;
                      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
                      gap: 20px;
                      margin-top: 20px;
                  }
                  .card {
                      background: #16213e;
                      border-radius: 8px;
                      padding: 15px;
                      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                  }
                  .card h2 {
                      margin-top: 0;
                      color: #ffa502;
                      font-size: 1.2em;
                  }
                  .card img {
                      width: 100%;
                      height: auto;
                      border-radius: 4px;
                      background: #fff;
                  }
                  .theme-badge {
                      display: inline-block;
                      padding: 2px 8px;
                      border-radius: 12px;
                      font-size: 0.8em;
                      margin-right: 5px;
                  }
                  .dark-badge {
                      background: #2c3e50;
                      color: #ecf0f1;
                  }
                  .light-badge {
                      background: #ecf0f1;
                      color: #2c3e50;
                  }
              </style>
          </head>
          <body>
              <h1>🖼️ Galerie des Diagrammes DBC</h1>
              <p>Généré automatiquement le <span id="date"></span></p>
              <div class="gallery" id="gallery"></div>
              <script>
                  document.getElementById('date').textContent = new Date().toLocaleDateString('fr-FR');
                  // Cette partie serait remplie dynamiquement par le serveur
                  const diagrams = [
                      {name: 'Dépendances DBC', file: 'dbc-dependencies', theme: 'dark'},
                      {name: 'Dépendances DBC', file: 'dbc-dependencies', theme: 'light'}
                  ];
                  
                  const gallery = document.getElementById('gallery');
                  diagrams.forEach(diagram => {
                      const card = document.createElement('div');
                      card.className = 'card';
                      const badgeClass = diagram.theme === 'dark' ? 'dark-badge' : 'light-badge';
                      card.innerHTML = `
                          <h2>${diagram.name}</h2>
                          <span class="theme-badge ${badgeClass}">${diagram.theme}</span>
                          <img src="${diagram.theme}/${diagram.file}.png" alt="${diagram.name} (${diagram.theme})">
                      `;
                      gallery.appendChild(card);
                  });
              </script>
          </body>
          </html>
          EOF
          echo "HTML gallery created"
      
      - name: Generate README for images
        run: |
          cat > images/README.md << 'EOF'
          # 🖼️ Diagrammes Générés
          
          Cette section contient les diagrammes générés automatiquement à partir des fichiers Mermaid.
          
          ## Structure
          
          ```
          images/
          ├── dark/          # Diagrammes avec thème sombre (PNG)
          ├── light/         # Diagrammes avec thème clair (PNG)
          ├── svg/           # Diagrammes en format SVG
          ├── pdf/           # Diagrammes en format PDF
          ├── custom/        # Diagrammes générés manuellement
          ├── index.html     # Galerie HTML
          └── README.md      # Ce fichier
          ```
          
          ## Régénération
          
          Les diagrammes sont régénérés automatiquement lors de chaque modification des fichiers `.mmd` dans le dossier `diagrams/`.
          
          Pour générer manuellement :
          ```bash
          # Avec le workflow
          gh workflow run generate-diagrams.yml
          
          # Ou localement
          mmdc -i diagrams/dbc-dependencies.mmd -o images/dark/dbc-dependencies.png -t dark
          ```
          
          ## Dernière génération
          
          Date : $(date -u +"%Y-%m-%d %H:%M UTC")
          EOF
          echo "Images README created"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diagrams-${{ matrix.theme }}-${{ matrix.format }}
          path: images/
          retention-days: 30
      
      - name: Create Pull Request
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "🔄 Auto-generate diagrams [skip ci]"
          committer: GitHub Action <action@github.com>
          author: GitHub Action <action@github.com>
          title: "🔄 Update generated diagrams"
          body: |
            ## 🔄 Diagrammes générés automatiquement
            
            Cette PR contient les diagrammes générés à partir des fichiers Mermaid mis à jour.
            
            ### Changements
            - Fichiers `.mmd` modifiés dans `diagrams/`
            - Diagrammes PNG/SVG/PDF régénérés dans `images/`
            
            ### Validation
            - [ ] Les diagrammes sont correctement générés
            - [ ] Les thèmes sombre et clair sont présents
            - [ ] Les formats PNG et SVG sont disponibles
            
            > Note : Cette PR a été créée automatiquement par GitHub Actions.
          branch: auto-generate-diagrams
          base: main
          delete-branch: true
          labels: |
            automated
            diagrams
            documentation
      
      - name: Commit and push (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          
          git add images/
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto-generate diagrams [skip ci]"
            git push
            echo "Changes committed and pushed"
          fi
      
      - name: Summary
        run: |
          echo "## 📊 Diagram Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Thème | Format | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.theme }} | ${{ matrix.format }} | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fichiers générés :" >> $GITHUB_STEP_SUMMARY
          find images/ -type f \( -name "*.png" -o -name "*.svg" -o -name "*.pdf" \) | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "- \`$file\` ($size)" >> $GITHUB_STEP_SUMMARY
          done

  validate:
    name: Validate Mermaid Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@latest
      
      - name: Validate Mermaid syntax
        run: |
          echo "🔍 Validation des fichiers Mermaid..."
          errors=0
          
          for file in diagrams/*.mmd diagrams/**/*.mmd; do
            if [ -f "$file" ]; then
              echo "📝 Validation de $file"
              
              # Vérifier la syntaxe de base
              if ! head -1 "$file" | grep -q "^%%\|^graph\|^sequenceDiagram\|^classDiagram\|^stateDiagram\|^erDiagram\|^journey\|^gantt\|^pie\|^flowchart"; then
                echo "⚠️  $file : Première ligne non standard"
              fi
              
              # Vérifier les balises de fermeture
              open_tags=$(grep -o "```mermaid" "$file" | wc -l)
              close_tags=$(grep -o "```" "$file" | wc -l)
              
              if [ $open_tags -gt 0 ] && [ $((close_tags - open_tags)) -ne $open_tags ]; then
                echo "❌ $file : Balises mermaid non fermées"
                errors=$((errors + 1))
              fi
              
              # Tenter une conversion de test
              if mmdc -i "$file" -o /tmp/test.svg 2>/tmp/error.log; then
                echo "✅ $file : Syntaxe valide"
              else
                echo "❌ $file : Erreur de syntaxe"
                cat /tmp/error.log
                errors=$((errors + 1))
              fi
            fi
          done
          
          if [ $errors -gt 0 ]; then
            echo "❌ $errors fichier(s) avec erreurs"
            exit 1
          else
            echo "✅ Tous les fichiers sont valides"
          fi
      
      - name: Summary
        run: |
          echo "## ✅ Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tous les fichiers Mermaid sont valides." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fichiers validés :" >> $GITHUB_STEP_SUMMARY
          find diagrams/ -name "*.mmd" | while read file; do
            echo "- ✅ \`$file\`" >> $GITHUB_STEP_SUMMARY
          done
