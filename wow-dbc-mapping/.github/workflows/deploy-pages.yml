name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'diagrams/**'
      - 'images/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
  schedule:
    - cron: '0 0 * * 0'  # Déploiement hebdomadaire le dimanche à minuit

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install MkDocs and plugins
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs-material \
            mkdocs-mermaid2-plugin \
            mkdocs-minify-plugin \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-awesome-pages-plugin \
            pymdown-extensions
      
      - name: Create mkdocs.yml if not exists
        run: |
          if [ ! -f mkdocs.yml ]; then
            cat > mkdocs.yml << 'EOF'
          site_name: Cartographie DBC WoW
          site_description: Cartographie complète des liaisons entre les fichiers DBC de World of Warcraft
          site_author: Communauté WoW Dev
          site_url: https://votre-username.github.io/wow-dbc-mapping/
          
          repo_name: wow-dbc-mapping
          repo_url: https://github.com/votre-username/wow-dbc-mapping
          edit_uri: edit/main/docs/
          
          copyright: Copyright &copy; 2026 Communauté WoW Dev
          
          theme:
            name: material
            language: fr
            palette:
              - scheme: default
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/weather-night
                  name: Mode sombre
              - scheme: slate
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/weather-sunny
                  name: Mode clair
            features:
              - navigation.tabs
              - navigation.tabs.sticky
              - navigation.sections
              - navigation.expand
              - navigation.indexes
              - navigation.top
              - navigation.footer
              - search.suggest
              - search.highlight
              - search.share
              - content.code.copy
              - content.code.annotate
              - toc.follow
              - toc.integrate
            icon:
              repo: fontawesome/brands/github
          
          plugins:
            - search:
                lang: fr
            - mermaid2:
                arguments:
                  theme: dark
                  securityLevel: loose
            - minify:
                minify_html: true
                minify_js: true
                minify_css: true
            - git-revision-date-localized:
                enable_creation_date: true
                type: date
            - awesome-pages:
                collapse_single_pages: true
          
          markdown_extensions:
            - admonition
            - attr_list
            - def_list
            - footnotes
            - md_in_html
            - toc:
                permalink: true
                toc_depth: 4
            - tables
            - pymdownx.arithmatex:
                generic: true
            - pymdownx.betterem:
                smart_enable: all
            - pymdownx.caret
            - pymdownx.details
            - pymdownx.emoji:
                emoji_index: !!python/name:material.extensions.emoji.twemoji
                emoji_generator: !!python/name:material.extensions.emoji.to_svg
            - pymdownx.highlight:
                anchor_linenums: true
                line_spans: __span
                pygments_lang_class: true
            - pymdownx.inlinehilite
            - pymdownx.keys
            - pymdownx.mark
            - pymdownx.smartsymbols
            - pymdownx.superfences:
                custom_fences:
                  - name: mermaid
                    class: mermaid
                    format: !!python/name:mermaid2.fence_mermaid_custom
            - pymdownx.tabbed:
                alternate_style: true
            - pymdownx.tasklist:
                custom_checkbox: true
            - pymdownx.tilde
          
          extra:
            social:
              - icon: fontawesome/brands/github
                link: https://github.com/votre-username
              - icon: fontawesome/brands/discord
                link: https://discord.gg/wowdev
            version:
              provider: mike
          
          nav:
            - 🏠 Accueil: index.md
            - 📊 Documentation:
              - 📌 Tableau des Liaisons: docs/01-tableau-liaisons.md
              - 🗺️ Schéma des Dépendances: docs/02-schema-dependances.md
              - 🔎 Analyse par Domaine: docs/03-analyse-domaines.md
              - ⚠️ Cas Particuliers: docs/04-cas-particuliers.md
            - 🖼️ Galerie: images/index.html
            - 🤝 Contribution: CONTRIBUTING.md
            - 📜 Licence: LICENSE
          EOF
            echo "✅ mkdocs.yml créé"
          else
            echo "✅ mkdocs.yml existe déjà"
          fi
      
      - name: Create index.md from README
        run: |
          if [ ! -f docs/index.md ]; then
            cp README.md docs/index.md
            echo "✅ docs/index.md créé depuis README.md"
          else
            echo "✅ docs/index.md existe déjà"
          fi
      
      - name: Copy diagrams to docs
        run: |
          mkdir -p docs/diagrams
          cp diagrams/*.mmd docs/diagrams/ 2>/dev/null || true
          echo "✅ Diagrammes copiés"
      
      - name: Copy images to docs
        run: |
          if [ -d "images" ]; then
            cp -r images docs/images 2>/dev/null || true
            echo "✅ Images copiées"
          else
            echo "⚠️ Pas de dossier images"
          fi
      
      - name: Build MkDocs site
        run: |
          mkdocs build --clean --strict
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Create .nojekyll file
        run: |
          touch site/.nojekyll
          echo "✅ .nojekyll créé"
      
      - name: Create CNAME file (optional)
        run: |
          # Décommentez et modifiez si vous avez un domaine personnalisé
          # echo "dbc-mapping.example.com" > site/CNAME
          echo "ℹ️ Pas de CNAME configuré"
      
      - name: Generate sitemap
        run: |
          cat > site/sitemap.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://votre-username.github.io/wow-dbc-mapping/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://votre-username.github.io/wow-dbc-mapping/docs/01-tableau-liaisons/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>https://votre-username.github.io/wow-dbc-mapping/docs/02-schema-dependances/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>https://votre-username.github.io/wow-dbc-mapping/docs/03-analyse-domaines/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>https://votre-username.github.io/wow-dbc-mapping/docs/04-cas-particuliers/</loc>
              <lastmod>$(date +%Y-%m-%d)</lastmod>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
          </urlset>
          EOF
          echo "✅ Sitemap généré"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
          name: github-pages
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: site/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check deployment
        run: |
          echo "🚀 Site déployé à : ${{ steps.deployment.outputs.page_url }}"
          echo "📊 Environnement : ${{ github.event.inputs.environment || 'production' }}"
          echo "🔗 Commit : ${{ github.sha }}"
          echo "🌿 Branche : ${{ github.ref }}"
      
      - name: Notify success
        run: |
          echo "## ✅ Déploiement réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL** : ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branche** : \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Date** : $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pages déployées :" >> $GITHUB_STEP_SUMMARY
          echo "- 🏠 Accueil" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Documentation (4 pages)" >> $GITHUB_STEP_SUMMARY
          echo "- 🖼️ Galerie de diagrammes" >> $GITHUB_STEP_SUMMARY
          echo "- 🤝 Guide de contribution" >> $GITHUB_STEP_SUMMARY

  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: site/
      
      - name: Validate HTML
        run: |
          echo "🔍 Validation du site généré..."
          errors=0
          
          # Vérifier la présence des fichiers principaux
          for file in index.html 404.html sitemap.xml; do
            if [ -f "site/$file" ]; then
              echo "✅ $file présent"
            else
              echo "❌ $file manquant"
              errors=$((errors + 1))
            fi
          done
          
          # Vérifier la présence des pages de documentation
          for page in 01-tableau-liaisons 02-schema-dependances 03-analyse-domaines 04-cas-particuliers; do
            if [ -d "site/docs/$page" ] || [ -f "site/docs/$page/index.html" ]; then
              echo "✅ Documentation $page présente"
            else
              echo "⚠️ Documentation $page absente"
            fi
          done
          
          # Vérifier les liens internes
          echo "🔗 Vérification des liens..."
          grep -r "href=" site/ | grep -v "http" | grep -v "mailto" | head -20
          
          if [ $errors -gt 0 ]; then
            echo "❌ $errors erreur(s) de validation"
            exit 1
          else
            echo "✅ Validation réussie"
          fi
      
      - name: Check for broken links
        run: |
          echo "🔍 Recherche de liens brisés..."
          broken=0
          
          while IFS= read -r link; do
            target="site/${link#/}"
            if [ ! -e "$target" ]; then
              echo "❌ Lien brisé : $link"
              broken=$((broken + 1))
            fi
          done < <(grep -rho 'href="[^"]*"' site/ | sed 's/href="//;s/"//' | grep -v "^http" | grep -v "^#" | sort -u)
          
          if [ $broken -gt 0 ]; then
            echo "⚠️ $broken lien(s) potentiellement brisé(s)"
          else
            echo "✅ Aucun lien brisé détecté"
          fi
      
      - name: Summary
        run: |
          echo "## 📋 Rapport de validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Élément | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build MkDocs | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages de documentation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Fichiers principaux | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Liens internes | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Structure du site :" >> $GITHUB_STEP_SUMMARY
          find site/ -maxdepth 3 -type d | sort | while read dir; do
            echo "- \`${dir#site/}\`" >> $GITHUB_STEP_SUMMARY
          done
