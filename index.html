<body>
    <!-- TOPBAR -->
    <div id="topbar">
        <div class="logo">⚡ GM Workbench</div>
        <div class="breadcrumb">AzerothCore <span id="version-selector" style="margin-left:6px;">
            <select id="version-select" class="select-input" style="width:auto; padding:2px 6px; font-size:10px; background:var(--surface2); border:1px solid var(--border);" onchange="changeVersion(this.value)">
                <option value="3.3.5a">3.3.5a</option>
                <option value="4.3.4">4.3.4</option>
                <option value="5.4.8">5.4.8</option>
            </select>
        </span> / <span id="breadcrumb-current" style="color:var(--text);">Bibliothèque</span></div>
        <div class="env-badge">ULTIMATE</div>
        <div class="topbar-actions">
            <button class="btn-icon" onclick="toggleTheme()" title="Thème">🎨</button>
            <button class="btn-icon" onclick="toggleTour()" title="Guide">📖</button>
            <button class="btn-icon" onclick="exportData()" title="Exporter">💾</button>
            <button class="btn-icon" onclick="importDataTrigger()" title="Importer">📂</button>
            <input type="file" id="import-file-input" style="display:none;" accept=".json,.csv" onchange="importData(event)">
            <button class="btn-icon" onclick="saveProfile()" title="Sauvegarder profil">👤</button>
            <div class="cmd-palette-trigger" onclick="toggleCommandPalette()"><span>⌘K</span> Recherche</div>
        </div>
    </div>

    <!-- MAIN -->
    <div id="main">
        <div id="left-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-header-text" style="font-weight:700; font-size:10px; color:var(--text-muted); letter-spacing:0.5px;">NAVIGATION</span>
                <button class="sidebar-toggle" onclick="toggleSidebar()">⟨</button>
            </div>
            <div class="sidebar-content" id="sidebar-content"></div>
        </div>
        <div class="drag-handle" id="left-drag-handle"></div>
        <div id="workspace">
            <div id="content-area"></div>
        </div>
        <div class="drag-handle" id="right-drag-handle"></div>
        <div id="right-inspector">
            <div class="inspector-header">
                <span class="inspector-title">Inspecteur</span>
                <button class="sidebar-toggle" onclick="toggleInspector()">⟩</button>
            </div>
            <div class="inspector-content" id="inspector-content"><div style="color:var(--text-muted);">Sélectionnez un outil.</div></div>
        </div>
    </div>

    <!-- BOTTOM BAR -->
    <div id="bottom-bar">
        <div class="bottom-tabs">
            <div class="bottom-tab active" data-bottom="terminal" onclick="switchBottomTab('terminal')">Console</div>
            <div class="bottom-tab" data-bottom="history" onclick="switchBottomTab('history')">Historique</div>
            <div class="bottom-tab" data-bottom="logs" onclick="switchBottomTab('logs')">Logs</div>
            <button class="sidebar-toggle" style="margin-left:auto;" onclick="toggleBottomBar()">⌄</button>
        </div>
        <div class="bottom-content" id="bottom-content"></div>
        <div class="bottom-content" id="bottom-history-content" style="display:none;"></div>
        <div class="bottom-content" id="bottom-logs-content" style="display:none;"></div>
    </div>

    <div class="status-bar">
        <span id="status-tools-count">Outils Chargés</span>
        <span>Moteur GM v4.0 Ultimate</span>
        <span id="status-db-info" style="color:var(--info);">DB & MPQ Référentiel Actif</span>
    </div>

    <!-- MODALS -->
    <div class="modal-overlay" id="command-palette">
        <div class="modal">
            <div class="modal-header"><input type="text" class="search-input" id="palette-input" placeholder="Tapez pour rechercher..." oninput="filterPalette()"></div>
            <div class="modal-body" id="palette-results" style="max-height:320px;"></div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeCommandPalette()">Fermer</button></div>
        </div>
    </div>
    <div class="modal-overlay" id="lib-picker-modal">
        <div class="modal">
            <div class="modal-header"><span style="font-weight:600;">📚 Sélectionner</span><button class="sidebar-toggle" onclick="closeLibPicker()">✕</button></div>
            <div class="modal-body">
                <input type="text" id="lib-picker-search" class="search-input" placeholder="Filtrer..." oninput="filterLibPicker()">
                <div style="margin-top:10px; display:flex; gap:4px; flex-wrap:wrap;" id="lib-picker-cats"></div>
                <div id="lib-picker-results" style="margin-top:10px; max-height:280px; overflow-y:auto;"></div>
            </div>
            <div class="modal-footer"><button class="btn btn-secondary" onclick="closeLibPicker()">Annuler</button></div>
        </div>
    </div>

        // ===================================================================
        // 3. ÉTAT GLOBAL
        // ===================================================================
        let activeToolId = 'library';
        let libPickerTarget = null;
        let commandHistory = [];
        let currentBottomTab = 'terminal';
        let sqlHistory = JSON.parse(localStorage.getItem('gm-sql-history') || '[]');
        let sqlTemplates = JSON.parse(localStorage.getItem('gm-sql-templates') || '{}');
        let currentSQLMode = 'auto';
        let macroSteps = [];
        let currentTheme = 'dark';
        let tourActive = false;
        let tourStep = 0;
        let chartInstance = null;
        let networkInstance = null;

        // ===================================================================
        // 4. FONCTIONS DE BASE
        // ===================================================================
        function logTerminal(msg, type = "cmd") {
            const content = document.getElementById('bottom-content');
            if (!content) return;
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = 'terminal-line';
            const colorClass = type === 'cmd' ? 'terminal-cmd' : type === 'sys' ? 'terminal-sys' : 'terminal-error';
            line.innerHTML = `<span class="terminal-time">[${time}]</span> <span class="${colorClass}">${msg}</span>`;
            content.appendChild(line);
            content.scrollTop = content.scrollHeight;
        }

        function addHistory(cmd) {
            commandHistory.unshift({ cmd, timestamp: new Date().toLocaleTimeString() });
            if (commandHistory.length > 50) commandHistory.pop();
            renderHistory();
        }

        function renderHistory() {
            const historyContent = document.getElementById('bottom-history-content');
            if (!historyContent) return;
            if (commandHistory.length === 0) {
                historyContent.innerHTML = '<div style="color:var(--text-muted); padding:8px;">Aucune commande.</div>';
                return;
            }
            historyContent.innerHTML = commandHistory.map((h, idx) =>
                `<div class="history-item" onclick="copyHistoryCmd(${idx})">
                    <span class="terminal-time">[${h.timestamp}]</span>
                    <span class="terminal-cmd" style="flex:1;">${h.cmd}</span>
                    <span style="color:var(--text-muted); font-size:9px;">📋</span>
                </div>`
            ).join('');
        }

        function copyHistoryCmd(idx) {
            if (commandHistory[idx]) {
                navigator.clipboard.writeText(commandHistory[idx].cmd);
                logTerminal(`Copié: ${commandHistory[idx].cmd}`, "sys");
            }
        }

        function switchBottomTab(tab) {
            currentBottomTab = tab;
            document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
            const target = document.querySelector(`.bottom-tab[data-bottom="${tab}"]`);
            if (target) target.classList.add('active');
            renderBottomTab(tab);
        }

        function renderBottomTab(tab) {
            const terminal = document.getElementById('bottom-content');
            const history = document.getElementById('bottom-history-content');
            const logs = document.getElementById('bottom-logs-content');
            if (terminal) terminal.style.display = tab === 'terminal' ? 'block' : 'none';
            if (history) history.style.display = tab === 'history' ? 'block' : 'none';
            if (logs) logs.style.display = tab === 'logs' ? 'block' : 'none';
            if (tab === 'history') renderHistory();
            if (tab === 'logs') {
                const lines = document.querySelectorAll('#bottom-content .terminal-line');
                if (logs) {
                    logs.innerHTML = lines.length ? Array.from(lines).map(l => `<div class="terminal-line">${l.innerHTML}</div>`).join('') :
                        '<div style="color:var(--text-muted); padding:8px;">Aucun log.</div>';
                }
            }
        }

        function showToast(msg) { logTerminal(`✅ ${msg}`, "sys"); }

        // ===================================================================
        // 5. SIDEBAR & NAVIGATION
        // ===================================================================
        function buildSidebar() {
            const container = document.getElementById('sidebar-content');
            container.innerHTML = '';
            const categories = [
                { id: 'basic', label: 'Général', icon: '🛠️' },
                { id: 'entities', label: 'Entités', icon: '🧩' },
                { id: 'content', label: 'Contenu', icon: '📜' },
                { id: 'database', label: 'DB & MPQ', icon: '🗄️' }
            ];
            categories.forEach(cat => {
                const catDiv = document.createElement('div');
                catDiv.className = 'sidebar-category open';
                catDiv.dataset.category = cat.id;
                const header = document.createElement('div');
                header.className = 'sidebar-category-header';
                header.innerHTML = `<span>${cat.icon} <span class="sidebar-category-title">${cat.label}</span></span><span class="sidebar-category-arrow">▶</span>`;
                header.addEventListener('click', () => catDiv.classList.toggle('open'));
                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'sidebar-category-items';
                toolDatabase.filter(t => t.category === cat.id).forEach(tool => {
                    const item = document.createElement('div');
                    item.className = 'sidebar-item';
                    item.dataset.tool = tool.id;
                    item.innerHTML = `<span>${tool.icon}</span><span class="sidebar-item-text">${tool.label}</span>`;
                    item.addEventListener('click', () => switchTool(tool.id));
                    itemsDiv.appendChild(item);
                });
                catDiv.appendChild(header);
                catDiv.appendChild(itemsDiv);
                container.appendChild(catDiv);
            });
        }

        function switchTool(toolId) {
            activeToolId = toolId;
            document.querySelectorAll('.workspace-panel').forEach(p => p.classList.remove('active'));
            const panel = document.getElementById(`panel-${toolId}`);
            if (panel) panel.classList.add('active');
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            const activeItem = document.querySelector(`.sidebar-item[data-tool="${toolId}"]`);
            if (activeItem) activeItem.classList.add('active');
            const tool = toolDatabase.find(t => t.id === toolId);
            if (tool) {
                document.getElementById('breadcrumb-current').textContent = tool.label;
                updateInspector(tool);
            }
            if (toolId === 'stats') initStats();
            if (toolId === 'loot_explorer') renderLootExplorer();
            if (toolId === 'spawn_viewer') renderSpawnViewer();
            if (toolId === 'achievements') renderAchievements();
            if (toolId === 'db_explorer') renderDbExplorer();
        }

        function updateInspector(tool) {
            const inspector = document.getElementById('inspector-content');
            let html = `<div style="font-weight:700; font-size:13px; margin-bottom:6px;">${tool.icon} ${tool.label}</div>
                        <div style="color:var(--text-muted); margin-bottom:12px; font-size:11px;">${tool.desc}</div>
                        <div style="font-size:10px; color:var(--text-muted); border-top:1px solid var(--border); padding-top:8px;">
                            Catégorie: <strong>${tool.category}</strong><br>ID: <strong style="font-family:var(--font-mono);">${tool.id}</strong>
                        </div>`;
            if (tool.dbTable) {
                const table = dbInfo.tables.find(t => t.name === tool.dbTable);
                if (table) html += `<div style="margin-top:8px; border-top:1px solid var(--border); padding-top:8px;">
                    <div style="font-size:10px; font-weight:700; color:var(--info);">📋 TABLE: ${tool.dbTable}</div>
                    <div style="font-size:10px; color:var(--text-muted);">${table.desc}</div>
                </div>`;
            }
            const dbcs = mpqInfo.keyDBCFiles.filter(d => d.dbTable && d.dbTable.includes(tool.dbTable || ''));
            if (dbcs.length) {
                html += `<div style="margin-top:8px; border-top:1px solid var(--border); padding-top:8px;">
                    <div style="font-size:10px; font-weight:700; color:var(--warning);">📦 DBC liés</div>
                    ${dbcs.map(d => `<div style="font-size:10px; font-family:var(--font-mono);">${d.file}</div>`).join('')}
                </div>`;
            }
            html += `<div style="margin-top:12px; padding-top:8px; border-top:1px solid var(--border); font-size:10px; color:var(--text-muted);">
                💡 Raccourci: ${tool.id === 'library' ? 'Ctrl+1' : tool.id === 'db_explorer' ? 'Ctrl+2' : ''}
            </div>`;
            inspector.innerHTML = html;
        }

        // ===================================================================
        // 6. RACCOURCIS CLAVIER
        // ===================================================================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                const num = parseInt(e.key);
                if (num >= 1 && num <= 9) {
                    e.preventDefault();
                    const tools = toolDatabase.filter(t => t.category !== 'database');
                    if (tools[num-1]) switchTool(tools[num-1].id);
                }
                if (e.key === 'k') { e.preventDefault(); toggleCommandPalette(); }
            }
            if (e.key === 'Escape') { closeCommandPalette(); closeLibPicker(); }
        });

        // ===================================================================
        // 7. THÈMES
        // ===================================================================
        function toggleTheme() {
            const body = document.body;
            if (body.classList.contains('light-theme')) {
                body.classList.remove('light-theme');
                body.classList.add('amber-theme');
                currentTheme = 'amber';
            } else if (body.classList.contains('amber-theme')) {
                body.classList.remove('amber-theme');
                currentTheme = 'dark';
            } else {
                body.classList.add('light-theme');
                currentTheme = 'light';
            }
            localStorage.setItem('gm-theme', currentTheme);
            logTerminal(`Thème: ${currentTheme}`, "sys");
        }

        // ===================================================================
        // 8. CHANGEMENT DE VERSION (simulé)
        // ===================================================================
        function changeVersion(ver) {
            logTerminal(`Version changée pour ${ver} (données simulées)`, "sys");
        }

        // ===================================================================
        // 9. PROFILS
        // ===================================================================
        function saveProfile() {
            const profile = {
                theme: currentTheme,
                sqlHistory: sqlHistory,
                sqlTemplates: sqlTemplates,
                macros: macroSteps,
                filters: { libCategory: document.getElementById('lib-category-select')?.value || 'all' }
            };
            localStorage.setItem('gm-profile', JSON.stringify(profile));
            showToast('Profil sauvegardé');
        }

        function loadProfile() {
            const data = localStorage.getItem('gm-profile');
            if (data) {
                try {
                    const profile = JSON.parse(data);
                    if (profile.theme) {
                        document.body.className = '';
                        if (profile.theme === 'light') document.body.classList.add('light-theme');
                        else if (profile.theme === 'amber') document.body.classList.add('amber-theme');
                        currentTheme = profile.theme;
                    }
                    if (profile.sqlHistory) sqlHistory = profile.sqlHistory;
                    if (profile.sqlTemplates) sqlTemplates = profile.sqlTemplates;
                    if (profile.macros) macroSteps = profile.macros;
                    if (profile.filters) {
                        const sel = document.getElementById('lib-category-select');
                        if (sel) sel.value = profile.filters.libCategory || 'all';
                    }
                    renderSQLHistory();
                    renderSQLTemplates();
                    renderLibraryTable();
                    showToast('Profil chargé');
                } catch(e) { console.warn('Profil invalide'); }
            }
        }

        // ===================================================================
        // 10. TOUR (guide interactif)
        // ===================================================================
        const tourSteps = [
            { target: '#topbar .logo', title: 'Bienvenue !', content: 'Ceci est le GM Workbench Ultimate.' },
            { target: '#left-sidebar', title: 'Navigation', content: 'Choisissez un outil dans le menu.' },
            { target: '#content-area', title: 'Espace de travail', content: 'Les outils s\'affichent ici.' },
            { target: '#right-inspector', title: 'Inspecteur', content: 'Informations contextuelles.' },
            { target: '#bottom-bar', title: 'Console', content: 'Commandes et logs.' }
        ];

        function toggleTour() {
            if (tourActive) { tourActive = false; document.querySelector('.tour-overlay')?.remove(); return; }
            tourActive = true; tourStep = 0; showTourStep();
        }

        function showTourStep() {
            const step = tourSteps[tourStep];
            if (!step) { tourActive = false; return; }
            document.querySelector('.tour-overlay')?.remove();
            const overlay = document.createElement('div');
            overlay.className = 'tour-overlay';
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.right = '0';
            overlay.style.bottom = '0';
            overlay.style.background = 'rgba(0,0,0,0.5)';
            overlay.style.zIndex = '2000';
            overlay.style.display = 'flex';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';
            const popup = document.createElement('div');
            popup.className = 'tour-popup';
            popup.innerHTML = `
                <h3>${step.title}</h3>
                <p>${step.content}</p>
                <div style="display:flex; gap:8px; justify-content:flex-end;">
                    <button class="btn btn-secondary" onclick="closeTour()">Fermer</button>
                    ${tourStep < tourSteps.length - 1 ? `<button class="btn" onclick="nextTourStep()">Suivant →</button>` : `<button class="btn btn-success" onclick="closeTour()">Terminé</button>`}
                </div>
            `;
            overlay.appendChild(popup);
            document.body.appendChild(overlay);
            document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight'));
            const target = document.querySelector(step.target);
            if (target) target.classList.add('tour-highlight');
        }

        function nextTourStep() { tourStep++; showTourStep(); }
        function closeTour() { tourActive = false; document.querySelector('.tour-overlay')?.remove(); document.querySelectorAll('.tour-highlight').forEach(el => el.classList.remove('tour-highlight')); }

        // ===================================================================
        // 11. BIBLIOTHÈQUE AVEC SÉLECTEUR DE TABLE DB
        // ===================================================================
        function buildLibraryPanel() {
            const tableOptions = Object.keys(libraryByTable).map(t => `<option value="${t}">${t}</option>`).join('');
            return `
                <div style="max-width:100%; margin:0 auto;">
                    <div class="panel-header">
                        <div><div class="panel-title">📚 Bibliothèque</div><div class="panel-subtitle">Recherche par table DB</div></div>
                        <span class="panel-badge" id="lib-count-badge">0</span>
                    </div>
                    <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
                        <input type="text" id="lib-search" class="search-input" placeholder="🔍 Rechercher..." style="flex:2; min-width:180px;" oninput="renderLibraryTable()">
                        <select id="lib-table-select" class="select-input" style="flex:1; min-width:140px;" onchange="renderLibraryTable()">
                            <option value="all">Toutes les tables</option>
                            ${tableOptions}
                        </select>
                        <select id="lib-category-select" class="select-input" style="flex:1; min-width:140px;" onchange="renderLibraryTable()">
                            <option value="all">Toutes catégories</option>
                            <option value="item">Items</option><option value="spell">Sorts</option>
                            <option value="creature">Créatures</option><option value="quest">Quêtes</option>
                            <option value="tele">Téléports</option><option value="gameobject">Gameobjects</option>
                            <option value="faction">Factions</option><option value="skill">Compétences</option>
                        </select>
                        <button class="btn btn-secondary btn-sm" onclick="resetLibraryFilters()">Reset</button>
                    </div>
                    <div id="lib-table-container" style="border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow-y:auto; max-height:600px;"></div>
                </div>
            `;
        }

        function resetLibraryFilters() {
            document.getElementById('lib-search').value = '';
            document.getElementById('lib-table-select').value = 'all';
            document.getElementById('lib-category-select').value = 'all';
            renderLibraryTable();
        }

        function renderLibraryTable() {
            const search = document.getElementById('lib-search').value.toLowerCase().trim();
            const tableFilter = document.getElementById('lib-table-select').value;
            const catFilter = document.getElementById('lib-category-select').value;

            let filtered = libraryData.filter(item => {
                const matchTable = tableFilter === 'all' || item.dbTable === tableFilter;
                const matchCat = catFilter === 'all' || item.category === catFilter;
                const matchSearch = !search ||
                    String(item.id).toLowerCase().includes(search) ||
                    item.name.toLowerCase().includes(search) ||
                    (item.sub && item.sub.toLowerCase().includes(search)) ||
                    (item.dbTable && item.dbTable.toLowerCase().includes(search));
                return matchTable && matchCat && matchSearch;
            });

            document.getElementById('lib-count-badge').textContent = filtered.length;
            const container = document.getElementById('lib-table-container');
            if (!container) return;
            if (!filtered.length) {
                container.innerHTML = '<div style="padding:24px; text-align:center; color:var(--text-muted);">Aucun résultat</div>';
                return;
            }
            let html = `<table class="lib-table"><thead><tr><th>ID</th><th>Nom</th><th>Table DB</th><th>Détails</th><th>Qualité</th><th>Actions</th></tr></thead><tbody>`;
            filtered.forEach(item => {
                let qualityColor = 'var(--text)';
                let qualityTag = '';
                if (item.quality === 'Legendary') { qualityColor = '#FF8000'; qualityTag = '<span class="tag tag-legendary">Légendaire</span>'; }
                else if (item.quality === 'Epic') { qualityColor = '#A335EE'; qualityTag = '<span class="tag tag-epic">Épique</span>'; }
                else if (item.quality === 'Rare') { qualityColor = '#0070DD'; qualityTag = '<span class="tag tag-rare">Rare</span>'; }
                else if (item.quality === 'Common') { qualityColor = '#9D9D9D'; qualityTag = '<span class="tag tag-common">Commun</span>'; }
                html += `<tr>
                    <td style="font-family:var(--font-mono); color:var(--accent);">${item.id}</td>
                    <td style="font-weight:500; color:${qualityColor};">${item.name} ${qualityTag}</td>
                    <td><span style="font-size:9px; padding:2px 6px; background:var(--surface2); border-radius:4px; color:var(--info); font-family:var(--font-mono);">${item.dbTable}</span></td>
                    <td style="color:var(--text-muted); font-size:10px;">${item.sub || '-'}</td>
                    <td>${qualityTag}</td>
                    <td>
                        <button class="btn btn-secondary btn-sm" onclick="copyID('${item.id}')">📋</button>
                        <button class="btn btn-success btn-sm" onclick="executeQuickCommand('${item.dbTable}','${item.id}')">⚡</button>
                        <button class="btn btn-warning btn-sm" onclick="showInDbExplorer('${item.dbTable||''}')">🗄️</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function copyID(id) { navigator.clipboard.writeText(String(id)); logTerminal(`ID ${id} copié`, "sys"); }

        function executeQuickCommand(table, id) {
            let cmd = '';
            switch(table) {
                case 'item_template': cmd = `.item add ${id} 1`; break;
                case 'spell_dbc': cmd = `.learn ${id}`; break;
                case 'creature_template': cmd = `.npc add ${id}`; break;
                case 'quest_template': cmd = `.quest add ${id}`; break;
                case 'game_tele': cmd = `.tele ${id}`; break;
                case 'gameobject_template': cmd = `.gobject add ${id}`; break;
                case 'faction': cmd = `.modify faction ${id} 42000 42000`; break;
                case 'skill_dbc': cmd = `.setskill ${id} 450 450`; break;
                default: cmd = `.lookup ${id}`;
            }
            logTerminal(cmd, "cmd"); addHistory(cmd);
            if (navigator.clipboard) navigator.clipboard.writeText(cmd);
        }

        function showInDbExplorer(table) {
            if (!table) { logTerminal("Aucune table", "error"); return; }
            switchTool('db_explorer');
            setTimeout(() => {
                document.getElementById('db-search').value = table;
                renderDbExplorer();
                document.querySelectorAll('.tab-inline[data-db-tab]').forEach(t => t.classList.remove('active'));
                document.querySelector('.tab-inline[data-db-tab="tables"]')?.classList.add('active');
                switchDbTab('tables');
            }, 100);
        }

        // ===================================================================
        // 12. EXPLORATEUR DB
        // ===================================================================
        function buildDbExplorerPanel() {
            let tableCards = dbInfo.tables.map(t => {
                const fields = t.fields.slice(0, 10).map(f => `<span class="db-field-tag" onclick="copyFieldName('${t.name}','${f}')">${f}</span>`).join('');
                return `<div class="db-table-card">
                    <div class="db-table-name">📋 ${t.name}</div>
                    <div class="db-table-desc">${t.desc}</div>
                    <div class="db-fields">${fields}</div>
                    <div style="font-size:9px; color:var(--text-muted); margin-top:6px;">${t.fields.length} champs</div>
                </div>`;
            }).join('');
            let relHtml = dbInfo.relationships.map(r =>
                `<div style="padding:6px 8px; border-bottom:1px solid var(--border); font-size:10px; font-family:var(--font-mono);">
                    <span style="color:var(--accent);">${r.from}</span> → <span style="color:var(--success);">${r.to}</span>
                    <span style="color:var(--text-muted); display:block; margin-top:2px; font-size:9px;">${r.desc}</span>
                </div>`
            ).join('');
            let dbcMapping = mpqInfo.keyDBCFiles.filter(d => d.dbTable && d.dbTable !== '-').map(d => {
                const tables = d.dbTable.split(',').map(s => s.trim());
                const links = tables.map(tn => `<span class="db-field-tag" onclick="showInDbExplorer('${tn}')">${tn}</span>`).join(' ');
                return `<div style="padding:6px 8px; border-bottom:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap;">
                    <span style="font-family:var(--font-mono); font-size:10px; color:var(--info);">${d.file}</span>
                    <span style="font-size:10px;">→ ${links}</span>
                </div>`;
            }).join('');
            return `
                <div style="max-width:100%;">
                    <div class="panel-header">
                        <div><div class="panel-title">🗄️ Explorateur DB</div><div class="panel-subtitle">Tables et relations</div></div>
                        <span class="panel-badge">${dbInfo.tables.length} tables</span>
                    </div>
                    <div style="display:flex; gap:8px; margin-bottom:12px;">
                        <input type="text" id="db-search" class="search-input" placeholder="🔍 Filtrer..." style="flex:2;" oninput="renderDbExplorer()">
                        <select id="db-table-select" class="select-input" style="flex:1;" onchange="renderDbExplorer()">
                            <option value="all">Toutes</option>
                            ${dbInfo.tables.map(t => `<option value="${t.name}">${t.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="tabs-inline">

        function switchDbTab(tab) {
            document.querySelectorAll('.tab-inline[data-db-tab]').forEach(t => t.classList.remove('active'));
            const target = document.querySelector(`.tab-inline[data-db-tab="${tab}"]`);
            if (target) target.classList.add('active');
            ['tables','relations','dbc','SQL','diagram'].forEach(id => {
                const el = document.getElementById(`db-${id}-container`);
                if (el) el.style.display = id === tab ? 'block' : 'none';
            });

        function renderDbExplorer() {
            const search = document.getElementById('db-search').value.toLowerCase().trim();
            const selected = document.getElementById('db-table-select').value;
            const container = document.getElementById('db-tables-container');
            if (!container) return;
            let filtered = dbInfo.tables.filter(t => {
                const matchSelect = selected === 'all' || t.name === selected;
                const matchSearch = !search || t.name.toLowerCase().includes(search) || t.desc.toLowerCase().includes(search) || t.fields.some(f => f.toLowerCase().includes(search));
                return matchSelect && matchSearch;
            });
            if (!filtered.length) {
                container.innerHTML = '<div style="padding:24px; text-align:center; color:var(--text-muted);">Aucune table</div>';
                return;
            }
            container.innerHTML = filtered.map(t => {
                const fields = t.fields.map(f => `<span class="db-field-tag" onclick="copyFieldName('${t.name}','${f}')">${f}</span>`).join('');
                return `<div class="db-table-card">
                    <div class="db-table-name">📋 ${t.name}</div>
                    <div class="db-table-desc">${t.desc}</div>
                    <div class="db-fields">${fields}</div>
                    <div style="font-size:9px; color:var(--text-muted); margin-top:6px;">${t.fields.length} champs</div>
                </div>`;
            }).join('');

        function copyFieldName(table, field) {
            const txt = `${table}.${field}`;
            navigator.clipboard.writeText(txt);
            logTerminal(`Champ copié: ${txt}`, "sys");
        }

        // ===================================================================
        // 13. DIAGRAMME
        // ===================================================================
        function initDiagram() {
            const container = document.getElementById('network-container');
            if (!container) return;
            if (networkInstance) { networkInstance.destroy(); networkInstance = null; }
            const nodes = [];
            const edges = [];
            const tableNames = dbInfo.tables.map(t => t.name);
            tableNames.forEach(name => {
                nodes.push({ id: name, label: name, shape: 'box', color: { background: '#1F2937', border: '#6366F1' }, font: { color: '#F9FAFB' } });
            });
            dbInfo.relationships.forEach(rel => {
                const from = rel.from.split('.')[0];
                const to = rel.to.split('.')[0];
                if (tableNames.includes(from) && tableNames.includes(to)) {
                    edges.push({ from: from, to: to, label: rel.desc, arrows: 'to', font: { align: 'top', color: '#9CA3AF' } });
                }
            });
            const data = { nodes: nodes, edges: edges };
            networkInstance = new vis.Network(container, data, { physics: { enabled: true }, edges: { color: '#4B5563', smooth: true }, layout: { improvedLayout: true } });
        }

        function onSQLTypeChange() {
            const type = document.getElementById('sql-type-select').value;
            const def = sqlQueryDefs[type];
            if (!def) return;
            const container = document.getElementById('sql-params-container');
            container.innerHTML = '';
            (def.fields || ['search']).forEach(f => {
                const g = document.createElement('div');
                g.className = 'param-group';
                const l = document.createElement('label');
                l.className = 'param-label';
                l.textContent = f.charAt(0).toUpperCase() + f.slice(1);
                g.appendChild(l);
                const input = document.createElement('input');
                input.className = 'param-input';
                input.type = 'text';
                input.placeholder = `Ex: ${f}`;
                input.dataset.paramName = f;
                input.addEventListener('input', generateSQLSnippet);
                g.appendChild(input);
                container.appendChild(g);
            });
            generateSQLSnippet();
        }

        function generateSQLSnippet() {
            const type = document.getElementById('sql-type-select').value;
            const def = sqlQueryDefs[type];
            if (!def) return;
            const values = {};
            document.querySelectorAll('#sql-params-container .param-input').forEach(i => values[i.dataset.paramName] = i.value.trim());
            let sql = def.build(values) || '--';
            const whereExtra = document.getElementById('sql-where-extra').value.trim();
            if (whereExtra) {
                if (sql.toUpperCase().includes('WHERE')) sql = sql.replace(/WHERE/i, `WHERE ${whereExtra} AND`);
                else sql = sql.replace(/LIMIT/i, `WHERE ${whereExtra} LIMIT`);
            }
            const order = document.getElementById('sql-order-by').value.trim();
            if (order) sql = sql.replace(/;/, ` ORDER BY ${order};`);
            const limit = document.getElementById('sql-limit').value.trim();
            if (limit && !sql.toUpperCase().includes('LIMIT')) sql = sql.replace(/;/, ` LIMIT ${limit};`);
            if (!document.getElementById('sql-semicolon').checked) sql = sql.replace(/;$/, '');
            if (document.getElementById('sql-one-line').checked) sql = sql.replace(/\s+/g, ' ');
            document.getElementById('sql-output').textContent = sql;
            document.getElementById('sql-output').dataset.sqlText = sql;
        }

        function copySQL() {
            const sql = document.getElementById('sql-output').dataset.sqlText || document.getElementById('sql-output').textContent;
            if (sql) { navigator.clipboard.writeText(sql); showToast('SQL copié'); }
        }
        function clearSQL() { document.getElementById('sql-type-select').value = 'lookup_item'; onSQLTypeChange(); }
        function formatSQL() {
            const o = document.getElementById('sql-output');
            let s = o.dataset.sqlText || o.textContent;
            s = s.replace(/\b(SELECT|FROM|WHERE|ORDER BY|LIMIT)\b/g, '\n$1');
            o.textContent = s.trim(); o.dataset.sqlText = s.trim();
        }
        function saveSQLToHistory() {
            const sql = document.getElementById('sql-output').dataset.sqlText || document.getElementById('sql-output').textContent;
            if (!sql) return;
            sqlHistory.unshift({ sql, timestamp: Date.now() });
            if (sqlHistory.length > 30) sqlHistory.pop();
            localStorage.setItem('gm-sql-history', JSON.stringify(sqlHistory));
            renderSQLHistory();
            showToast('SQL sauvegardé');
        }
        function renderSQLHistory() {
            const c = document.getElementById('sql-history-list');
            if (!c) return;
            if (!sqlHistory.length) { c.innerHTML = '<div style="color:var(--text-muted); padding:4px;">Aucun</div>'; return; }
            c.innerHTML = sqlHistory.map((h,i) =>
                `<div class="sql-history-item"><span class="sql-text">${h.sql}</span>
                <div class="actions"><button class="btn btn-secondary btn-sm" onclick="loadSQLFromHistory(${i})">Charger</button>
                <button class="btn btn-secondary btn-sm" onclick="copySQLFromHistory(${i})">Copier</button></div></div>`
            ).join('');
        }
        function loadSQLFromHistory(i) {
            const s = sqlHistory[i].sql;
            document.getElementById('sql-output').textContent = s;
            document.getElementById('sql-output').dataset.sqlText = s;
        }
        function copySQLFromHistory(i) { navigator.clipboard.writeText(sqlHistory[i].sql); showToast('Copié depuis historique'); }
        function clearSQLHistory() { sqlHistory = []; localStorage.setItem('gm-sql-history', JSON.stringify(sqlHistory)); renderSQLHistory(); showToast('Historique vidé'); }

        function saveSQLAsTemplate() {
            const s = document.getElementById('sql-output').dataset.sqlText || document.getElementById('sql-output').textContent;
            if (!s) return;
            const n = prompt('Nom du template:');
            if (!n) return;
            sqlTemplates[n] = s;
            localStorage.setItem('gm-sql-templates', JSON.stringify(sqlTemplates));
            renderSQLTemplates();
            showToast(`Template "${n}" sauvegardé`);
        }
        function renderSQLTemplates() {
            const sel = document.getElementById('sql-template-select');
            if (!sel) return;
            sel.innerHTML = '<option value="">-- Templates --</option>';
            for (const [n] of Object.entries(sqlTemplates)) {
                const o = document.createElement('option');
                o.value = n; o.textContent = n;
                sel.appendChild(o);
            }
        }
        function loadSQLTemplate(n) {
            if (!n || !sqlTemplates[n]) return;
            document.getElementById('sql-output').textContent = sqlTemplates[n];
            document.getElementById('sql-output').dataset.sqlText = sqlTemplates[n];
        }
        function deleteSQLTemplate() {
            const sel = document.getElementById('sql-template-select');
            const n = sel.value;
            if (!n || !sqlTemplates[n]) return;
            delete sqlTemplates[n];
            localStorage.setItem('gm-sql-templates', JSON.stringify(sqlTemplates));
            renderSQLTemplates();
            showToast(`Template "${n}" supprimé`);
        }

        function toggleSQLMode() {
            const mode = document.querySelector('input[name="sql-mode"]:checked').value;
            document.getElementById('sql-auto-section').style.display = mode === 'auto' ? 'block' : 'none';
            document.getElementById('sql-manual-editor').style.display = mode === 'manual' ? 'block' : 'none';
            if (mode === 'manual') updateManualSQLPreview();
            else generateSQLSnippet();
        }
        function updateManualSQLPreview() {
            const s = document.getElementById('sql-manual-text').value;
            document.getElementById('sql-output').textContent = s;
            document.getElementById('sql-output').dataset.sqlText = s;
        }
        function insertTableName() {
            if (document.querySelector('input[name="sql-mode"]:checked').value !== 'manual') {
                document.querySelector('input[name="sql-mode"][value="manual"]').checked = true;
                toggleSQLMode();
            }
            const t = document.getElementById('sql-table-select').value;
            if (t) {
                document.getElementById('sql-manual-text').value += ` ${t}`;
                updateManualSQLPreview();
            }
        }
        function insertColumnName() {
            const c = document.getElementById('sql-column-select').value;
            if (c && document.querySelector('input[name="sql-mode"]:checked').value === 'manual') {
                document.getElementById('sql-manual-text').value += ` ${c}`;
                updateManualSQLPreview();
            }
        }
        function onTableSelect() {
            const t = document.getElementById('sql-table-select').value;
            const cs = document.getElementById('sql-column-select');
            if (!t) { cs.innerHTML = '<option value="">-- Colonnes --</option>'; return; }
            const table = dbInfo.tables.find(tbl => tbl.name === t);
            cs.innerHTML = table ? table.fields.map(f => `<option value="${f}">${f}</option>`).join('') : '<option value="">--</option>';

        function addMacroStep() {
            const input = document.getElementById('macro-input');

            if (!cmd) return;
            macroSteps.push(cmd);
            input.value = '';
            renderMacroSteps();
            showToast('Étape ajoutée');
        }
        function renderMacroSteps() {
            const container = document.getElementById('macro-steps');
            if (!container) return;
            if (!macroSteps.length) { container.innerHTML = '<div style="color:var(--text-muted);">Aucune étape</div>'; return; }
            container.innerHTML = macroSteps.map((step, i) =>
                `<div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--border);">

                    <button class="btn btn-danger btn-sm" onclick="removeMacroStep(${i})">✕</button>
                </div>`
            ).join('');
        }
        function removeMacroStep(i) { macroSteps.splice(i,1); renderMacroSteps(); }
        function clearMacro() { macroSteps = []; renderMacroSteps(); document.getElementById('macro-output').textContent = '-- Macro vidée'; }
        function runMacro() {
            if (!macroSteps.length) { logTerminal("Aucune étape", "error"); return; }
            document.getElementById('macro-output').textContent = macroSteps.join('\n');
            macroSteps.forEach(cmd => { logTerminal(cmd, "cmd"); addHistory(cmd); });
            showToast('Macro exécutée');
        }

            window.spawnData = [
                { id1: 36597, guid: 100, map: 571, x: 1234, y: 5678, z: 90 },
                { id1: 36597, guid: 101, map: 571, x: 1240, y: 5680, z: 91 },
                { id1: 36855, guid: 200, map: 571, x: 1300, y: 5700, z: 95 }
            ];
            window.filterSpawns = function() {
                const search = document.getElementById('spawn-search').value.trim();
                const results = document.getElementById('spawn-results');
                if (!search) { results.innerHTML = '<div style="color:var(--text-muted);">Entrez un ID.</div>'; return; }
                const filtered = window.spawnData.filter(s => String(s.id1).includes(search));
                if (!filtered.length) { results.innerHTML = '<div style="color:var(--text-muted);">Aucun spawn.</div>'; return; }
                let html = `<table class="lib-table"><thead><tr><th>GUID</th><th>Map</th><th>X</th><th>Y</th><th>Z</th></tr></thead><tbody>`;
                filtered.forEach(s => html += `<tr><td>${s.guid}</td><td>${s.map}</td><td>${s.x}</td><td>${s.y}</td><td>${s.z}</td></tr>`);
                html += '</tbody></table>';
                results.innerHTML = html;
            };
        }

        // ===================================================================
        // 19. STATISTIQUES
        // ===================================================================
        function initStats() {
            const panel = document.getElementById('panel-stats');
            if (!panel) return;
            panel.innerHTML = `
                <div style="max-width:100%;">
                    <div class="panel-header"><div><div class="panel-title">📊 Statistiques</div><div class="panel-subtitle">Distribution</div></div></div>
                    <div class="grid-2">
                        <div class="chart-container"><canvas id="chart-quality"></canvas></div>
                        <div class="chart-container"><canvas id="chart-category"></canvas></div>
                    </div>
                </div>
            `;
            const qualities = ['Legendary','Epic','Rare','Common'];
            const counts = qualities.map(q => libraryData.filter(i => i.quality === q).length);
            if (document.getElementById('chart-quality')) {
                new Chart(document.getElementById('chart-quality'), {
                    type: 'doughnut',
                    data: { labels: qualities, datasets: [{ data: counts, backgroundColor: ['#FF8000','#A335EE','#0070DD','#9D9D9D'] }] },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#F9FAFB' } } } }
                });
            }
            const cats = Object.keys(libraryByTable);
            const catCounts = cats.map(c => libraryByTable[c].length);
            if (document.getElementById('chart-category')) {
                new Chart(document.getElementById('chart-category'), {
                    type: 'bar',
                    data: { labels: cats, datasets: [{ label: 'Nombre', data: catCounts, backgroundColor: '#6366F1' }] },
                    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: '#F9FAFB' } }, x: { ticks: { color: '#F9FAFB' } } } }
                });
            }
        }

        // ===================================================================
        // 20. OUTILS DE COMMANDE
        // ===================================================================
        function buildToolPanel(tool) {
            let fieldsHtml = '';
            const fieldDefs = {
                'item_id': { label: 'ID Objet', placeholder: '49623' },
                'amount': { label: 'Quantité', placeholder: '1' },
                'location': { label: 'Destination', placeholder: 'dalaran' },
                'creature_id': { label: 'ID Créature', placeholder: '36597' },
                'spell_id': { label: 'ID Sort', placeholder: '133' },
                'character': { label: 'Personnage', placeholder: 'Arthas' },
                'quest_id': { label: 'ID Quête', placeholder: '24545' },
                'faction_id': { label: 'ID Faction', placeholder: '1090' },
                'rep_value': { label: 'Valeur', placeholder: '42000' },
                'gobject_id': { label: 'ID Gameobject', placeholder: '201959' },
                'skill_id': { label: 'ID Compétence', placeholder: '333' },
                'skill_level': { label: 'Niveau', placeholder: '450' }
            };
            tool.fields.forEach(f => {
                const def = fieldDefs[f] || { label: f, placeholder: '...' };
                const isID = f.includes('id') || f === 'location' || f === 'skill_id';
                fieldsHtml += `
                    <div class="param-group">
                        <label class="param-label">${def.label}</label>
                        <div class="lib-picker-input">
                            <input type="text" id="${tool.id}-${f}" class="param-input" placeholder="${def.placeholder}">
                            ${isID ? `<button class="lib-picker-btn" onclick="openLibPicker('${tool.id}-${f}')">📚</button>` : ''}
                        </div>
                    </div>
                `;
            });
            return `
                <div style="max-width:700px; margin:0 auto;">
                    <div class="panel-header"><div><div class="panel-title">${tool.icon} ${tool.label}</div><div class="panel-subtitle">${tool.desc}</div></div></div>
                    ${fieldsHtml}
                    <button class="btn btn-success" onclick="generateToolOutput('${tool.id}')">⚡ Générer</button>
                    <button class="btn btn-secondary" onclick="copyToolOutput('${tool.id}')">📄 Copier</button>
                    <button class="btn btn-danger btn-sm" onclick="clearToolFields('${tool.id}')">🗑️ Vider</button>
                    <div class="output-command" id="output-${tool.id}">-- Commande</div>
                </div>
            `;
        }

        function generateToolOutput(toolId) {
            const tool = toolDatabase.find(t => t.id === toolId);
            if (!tool) return;
            const getVal = (f) => document.getElementById(`${toolId}-${f}`)?.value.trim() || '';
            let cmd = '';
            switch(toolId) {
                case 'item_add': cmd = `.item add ${getVal('item_id')||'0'} ${getVal('amount')||'1'}`; break;
                case 'teleport': cmd = `.tele ${getVal('location')||'dalaran'}`; break;
                case 'npc_spawn': cmd = `.npc add ${getVal('creature_id')||'0'}`; break;
                case 'learn_spell': cmd = `.learn ${getVal('spell_id')||'0'}${getVal('character') ? ' '+getVal('character') : ''}`; break;
                case 'quest_add': cmd = `.quest add ${getVal('quest_id')||'0'}`; break;
                case 'cast_spell': cmd = `.cast ${getVal('spell_id')||'0'}`; break;
                case 'modify_faction': cmd = `.modify faction ${getVal('faction_id')||'0'} ${getVal('rep_value')||'42000'} ${getVal('rep_value')||'42000'}`; break;
                case 'gobject_add': cmd = `.gobject add ${getVal('gobject_id')||'0'}`; break;
                case 'setskill': cmd = `.setskill ${getVal('skill_id')||'0'} ${getVal('skill_level')||'450'} ${getVal('skill_level')||'450'}`; break;
                default: cmd = `-- Commande non supportée`;
            }
            document.getElementById(`output-${toolId}`).textContent = cmd;
            logTerminal(cmd, "cmd");
            addHistory(cmd);
        }

        function copyToolOutput(toolId) {
            const txt = document.getElementById(`output-${toolId}`).textContent;
            if (txt && !txt.startsWith('--')) { navigator.clipboard.writeText(txt); showToast('Copié'); }
            else showToast('Aucune commande', 'error');
        }

        function clearToolFields(toolId) {
            const tool = toolDatabase.find(t => t.id === toolId);
            if (!tool) return;
            tool.fields.forEach(f => {
                const el = document.getElementById(`${toolId}-${f}`);
                if (el) el.value = '';
            });
            document.getElementById(`output-${toolId}`).textContent = '-- Commande';
        }

        // ===================================================================
        // 21. LIBRARY PICKER
        // ===================================================================
        function openLibPicker(targetId) {
            libPickerTarget = targetId;
            document.getElementById('lib-picker-modal').classList.add('open');
            document.getElementById('lib-picker-search').value = '';
            buildPickerCategories();
            filterLibPicker();
        }
        function closeLibPicker() {
            document.getElementById('lib-picker-modal').classList.remove('open');
            libPickerTarget = null;
        }
        function buildPickerCategories() {
            const container = document.getElementById('lib-picker-cats');
            if (!container) return;
            const cats = Object.keys(libraryByTable);
            container.innerHTML = cats.map(c => `<span class="db-field-tag" onclick="filterPickerByCat('${c}')">${c}</span>`).join('') +
                `<span class="db-field-tag" onclick="filterPickerByCat('all')">Tous</span>`;
        }
        function filterPickerByCat(cat) {
            document.getElementById('lib-picker-search').value = '';
            filterLibPicker(cat);
        }
        function filterLibPicker(forceCat) {
            const q = document.getElementById('lib-picker-search').value.toLowerCase();
            const results = document.getElementById('lib-picker-results');
            let filtered = libraryData;
            if (q) filtered = filtered.filter(i => i.name.toLowerCase().includes(q) || String(i.id).toLowerCase().includes(q));
            if (forceCat && forceCat !== 'all') filtered = filtered.filter(i => i.dbTable === forceCat);
            if (!filtered.length) { results.innerHTML = '<div style="padding:16px; color:var(--text-muted);">Aucun</div>'; return; }
            results.innerHTML = filtered.slice(0, 80).map(i =>
                `<div style="padding:8px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; justify-content:space-between;" onclick="selectLibItem('${i.id}')">
                    <span><strong>${i.name}</strong> <span style="color:var(--text-muted); font-size:10px;">(${i.dbTable})</span></span>
                    <span style="color:var(--accent); font-family:var(--font-mono);">${i.id}</span>
                </div>`
            ).join('');
        }
        function selectLibItem(id) {
            if (libPickerTarget) {
                const el = document.getElementById(libPickerTarget);
                if (el) el.value = id;
            }
            closeLibPicker();
        }

        // ===================================================================
        // 22. COMMAND PALETTE
        // ===================================================================
        function toggleCommandPalette() {
            const pal = document.getElementById('command-palette');
            pal.classList.toggle('open');
            if (pal.classList.contains('open')) { document.getElementById('palette-input').focus(); filterPalette(); }
        }
        function closeCommandPalette() { document.getElementById('command-palette').classList.remove('open'); }
        function filterPalette() {
            const q = document.getElementById('palette-input').value.toLowerCase();
            const res = document.getElementById('palette-results');
            if (!q) { res.innerHTML = '<div style="padding:12px; color:var(--text-muted);">Tapez...</div>'; return; }
            let toolMatches = toolDatabase.filter(t => t.label.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
            let libMatches = libraryData.filter(i => i.name.toLowerCase().includes(q) || String(i.id).toLowerCase().includes(q)).slice(0, 10);
            let html = '';
            if (toolMatches.length) {
                html += `<div style="font-size:10px; font-weight:700; color:var(--accent); padding:8px 12px;">Outils</div>`;
                toolMatches.forEach(t => {
                    html += `<div style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border);" onclick="switchTool('${t.id}'); closeCommandPalette();">${t.icon} ${t.label}</div>`;
                });
            }
            if (libMatches.length) {
                html += `<div style="font-size:10px; font-weight:700; color:var(--success); padding:8px 12px;">Bibliothèque</div>`;
                libMatches.forEach(i => {
                    html += `<div style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border);" onclick="executeQuickCommand('${i.dbTable}','${i.id}'); closeCommandPalette();">${i.name} (${i.id})</div>`;
                });
            }
            if (!html) html = '<div style="padding:16px; color:var(--text-muted);">Aucun</div>';
            res.innerHTML = html;
        }

        // ===================================================================
        // 23. EXPORT / IMPORT
        // ===================================================================
        function exportData() {
            const data = JSON.stringify({ libraryByTable, dbInfo, mpqInfo, toolDatabase, sqlHistory, sqlTemplates, macroSteps });
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'gm_workbench_export.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Export JSON effectué');
        }
        function importDataTrigger() { document.getElementById('import-file-input').click(); }
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.libraryByTable) {
                        Object.assign(libraryByTable, imported.libraryByTable);
                        // Reconstruire libraryData
                        libraryData = [];
                        for (const [table, items] of Object.entries(libraryByTable)) {
                            items.forEach(item => {
                                libraryData.push({
                                    ...item,
                                    category: table,
                                    dbTable: table,
                                    quality: item.quality || null
                                });
                            });
                        }
                    }
                    if (imported.dbInfo) Object.assign(dbInfo, imported.dbInfo);
                    if (imported.mpqInfo) Object.assign(mpqInfo, imported.mpqInfo);
                    if (imported.toolDatabase) toolDatabase = imported.toolDatabase;
                    if (imported.sqlHistory) sqlHistory = imported.sqlHistory;
                    if (imported.sqlTemplates) sqlTemplates = imported.sqlTemplates;
                    if (imported.macroSteps) macroSteps = imported.macroSteps;
                    localStorage.setItem('gm-sql-history', JSON.stringify(sqlHistory));
                    localStorage.setItem('gm-sql-templates', JSON.stringify(sqlTemplates));
                    renderLibraryTable();
                    renderDbExplorer();
                    renderSQLHistory();
                    renderSQLTemplates();
                    renderMacroSteps();
                    buildSidebar();
                    buildAllPanels();
                    updateStatusBar();
                    showToast('Données importées');
                } catch(err) { logTerminal('Erreur import: '+err.message, 'error'); }
            };
            reader.readAsText(file);
        }

        // ===================================================================
        // 24. BUILD ALL PANELS
        // ===================================================================
        function buildAllPanels() {
            const content = document.getElementById('content-area');
            content.innerHTML = '';
            toolDatabase.forEach(tool => {
                const panel = document.createElement('div');
                panel.className = 'workspace-panel';
                panel.id = `panel-${tool.id}`;
                if (tool.id === 'library') panel.innerHTML = buildLibraryPanel();
                else if (tool.id === 'db_explorer') panel.innerHTML = buildDbExplorerPanel();
                else if (tool.id === 'mpq_info') panel.innerHTML = buildMpqInfoPanel();
                else if (tool.id === 'macro') panel.innerHTML = buildMacroPanel();
                else if (tool.id === 'loot_explorer') panel.innerHTML = `<div style="max-width:100%;"><div class="panel-header"><div><div class="panel-title">💎 Loot Explorer</div><div class="panel-subtitle">...</div></div></div><div id="loot-content"></div></div>`;
                else if (tool.id === 'achievements') panel.innerHTML = `<div style="max-width:100%;"><div class="panel-header"><div><div class="panel-title">🏆 Succès</div><div class="panel-subtitle">...</div></div></div><div id="achiev-content"></div></div>`;
                else if (tool.id === 'spawn_viewer') panel.innerHTML = `<div style="max-width:100%;"><div class="panel-header"><div><div class="panel-title">📍 Spawn Viewer</div><div class="panel-subtitle">...</div></div></div><div id="spawn-content"></div></div>`;
                else if (tool.id === 'stats') panel.innerHTML = `<div style="max-width:100%;"><div class="panel-header"><div><div class="panel-title">📊 Statistiques</div><div class="panel-subtitle">...</div></div></div><div id="stats-content"></div></div>`;
                else panel.innerHTML = buildToolPanel(tool);
                content.appendChild(panel);
            });
            setTimeout(() => {
                if (document.getElementById('panel-loot_explorer')) renderLootExplorer();
                if (document.getElementById('panel-achievements')) renderAchievements();
                if (document.getElementById('panel-spawn_viewer')) renderSpawnViewer();
                if (document.getElementById('panel-stats')) initStats();
            }, 100);
        }

        // ===================================================================
        // 25. MPQ INFO PANEL
        // ===================================================================
        function buildMpqInfoPanel() {
            let mpqHtml = mpqInfo.keyMPQFiles.map(f => `<div style="padding:6px; border-bottom:1px solid var(--border);">${f.file} — ${f.desc}</div>`).join('');
            let dbcHtml = mpqInfo.keyDBCFiles.map(f => `<div style="padding:6px; border-bottom:1px solid var(--border); display:flex; gap:8px;"><span style="font-family:var(--font-mono); color:var(--info);">${f.file}</span><span style="color:var(--text-muted);">${f.desc}</span></div>`).join('');
            return `
                <div style="max-width:100%;">
                    <div class="panel-header"><div><div class="panel-title">📦 MPQ / DBC</div><div class="panel-subtitle">Fichiers client</div></div></div>
                    <div class="info-callout">${mpqInfo.description}</div>
                    <div class="grid-2">
                        <div><h3 style="font-size:13px; color:var(--warning);">MPQ</h3>${mpqHtml}</div>
                        <div><h3 style="font-size:13px; color:var(--info);">DBC</h3>${dbcHtml}</div>
                    </div>
                </div>
            `;
        }

        // ===================================================================
        // 26. STATUS BAR & INIT
        // ===================================================================
        function updateStatusBar() {
            document.getElementById('status-tools-count').textContent = `Outils: ${toolDatabase.length} | IDs: ${libraryData.length}`;
            document.getElementById('status-db-info').textContent = `DB: ${dbInfo.tables.length} tables | DBC: ${mpqInfo.keyDBCFiles.length} fichiers`;
        }

        // ===================================================================
        // 27. LAYOUT CONTROLS
        // ===================================================================
        function toggleSidebar() { document.getElementById('left-sidebar').classList.toggle('collapsed'); }
        function toggleInspector() { document.getElementById('right-inspector').classList.toggle('collapsed'); }
        function toggleBottomBar() { document.getElementById('bottom-bar').classList.toggle('collapsed'); }

        function initDragResize() {
            const lh = document.getElementById('left-drag-handle');
            if (lh) {
                lh.addEventListener('mousedown', (e) => {
                    const startX = e.clientX;
                    const sidebar = document.getElementById('left-sidebar');
                    const startWidth = sidebar.offsetWidth;
                    const drag = (ev) => { const w = Math.max(42, Math.min(400, startWidth + ev.clientX - startX)); sidebar.style.width = w+'px'; };
                    const stop = () => { document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', stop); };
                    document.addEventListener('mousemove', drag);
                    document.addEventListener('mouseup', stop);
                });
            }
            const rh = document.getElementById('right-drag-handle');
            if (rh) {
                rh.addEventListener('mousedown', (e) => {
                    const startX = e.clientX;
                    const inspector = document.getElementById('right-inspector');
                    const startWidth = inspector.offsetWidth;
                    const drag = (ev) => {
                        const w = Math.max(0, Math.min(400, startWidth - (ev.clientX - startX)));
                        inspector.style.width = w+'px';
                        if (w <= 10) inspector.classList.add('collapsed');
                        else inspector.classList.remove('collapsed');
                    };
                    const stop = () => { document.removeEventListener('mousemove', drag); document.removeEventListener('mouseup', stop); };
                    document.addEventListener('mousemove', drag);
                    document.addEventListener('mouseup', stop);
                });
            }
        }

        // ===================================================================
        // 28. INITIALISATION
        // ===================================================================
        function init() {
            loadProfile();
            buildSidebar();
            buildAllPanels();
            updateStatusBar();
            renderSQLHistory();
            renderSQLTemplates();
            renderMacroSteps();
            switchTool('library');
            renderBottomTab(currentBottomTab);
            logTerminal("GM Workbench Ultimate (DB séparée) initialisé", "sys");
            logTerminal(`${libraryData.length} IDs répartis dans ${Object.keys(libraryByTable).length} tables`, "sys");
            logTerminal("Filtrez par table DB pour une recherche ciblée.", "sys");
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { closeCommandPalette(); closeLibPicker(); }
            });
            initDragResize();
            if (!localStorage.getItem('gm-tour-done')) {
                setTimeout(() => { toggleTour(); localStorage.setItem('gm-tour-done', 'true'); }, 800);
            }
        }

        window.onload = init;
    </script>
